name: Release

on:
  workflow_dispatch:
    inputs:
      release-version:
        description: 'Release version (e.g. 1.29)'
        required: true
      next-version:
        description: 'Next development version (e.g. 1.30-SNAPSHOT)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: corretto

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set release version
        run: mvn -B versions:set -DnewVersion=${{ github.event.inputs.release-version }} -DgenerateBackupPoms=false

      - name: Build and test
        run: mvn -B clean verify -Djava.awt.headless=true

      - name: Commit and tag release
        run: |
          git add -A
          git commit -m "Release v${{ github.event.inputs.release-version }}"
          git tag "v${{ github.event.inputs.release-version }}"

      - name: Set next development version
        run: |
          mvn -B versions:set -DnewVersion=${{ github.event.inputs.next-version }} -DgenerateBackupPoms=false
          git add -A
          git commit -m "Prepare next development version ${{ github.event.inputs.next-version }}"

      - name: Push changes and tag
        run: |
          git push origin master
          git push origin "v${{ github.event.inputs.release-version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.release-version }}
          name: v${{ github.event.inputs.release-version }}
          generate_release_notes: true
          files: kumo-cli/target/kumo-cli-${{ github.event.inputs.release-version }}.jar
